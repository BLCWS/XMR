services:
  - type: web
    name: unlock-device-backend
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: "Unlock Device <onboarding@resend.dev>"
      - key: ALLOWED_ORIGIN
        value: "*"
